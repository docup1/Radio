http_public:
  addr: ":8080"
  read_header_timeout: 5s

http_private:
  addr: ":8081"
  read_header_timeout: 5s

grpc:
  addr: ":8082"

storage:
  chunk_dir: "/data/chunks"
  final_dir: "/data/media"
  max_chunk_size: 10485760
  max_file_size: 2147483648

db:
  host: postgres
  port: 5432
  user: radio
  name: radio_content
  sslmode: disable
  ping_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 1h
