services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: radio
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio"]
      interval: 3s
      timeout: 3s
      retries: 10

  user-service-migrations:
    image: liquibase/liquibase:4.33.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./user-service/migrations:/migrations:ro
    command: >-
      --search-path=/migrations
      --changelog-file=changelog.yaml
      --url=jdbc:postgresql://postgres:5432/radio_users
      --username=radio
      --password=${DB_PASSWORD:?DB_PASSWORD is required}
      update

  user-service:
    build: ./user-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service-migrations:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SWAGGER_ENABLED: "true"
    volumes:
      - ./user-service/config.yaml:/app/config.yaml:ro

  content-service-migrations:
    image: liquibase/liquibase:4.33.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./content-service/migrations:/migrations:ro
    command: >-
      --search-path=/migrations
      --changelog-file=changelog.yaml
      --url=jdbc:postgresql://postgres:5432/radio_content
      --username=radio
      --password=${DB_PASSWORD:?DB_PASSWORD is required}
      update

  stream-service-migrations:
    image: liquibase/liquibase:4.33.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./stream-service/migrations:/migrations:ro
    command: >-
      --search-path=/migrations
      --changelog-file=changelog.yaml
      --url=jdbc:postgresql://postgres:5432/radio_streams
      --username=radio
      --password=${DB_PASSWORD:?DB_PASSWORD is required}
      update

  content-service:
    build: ./content-service
    depends_on:
      postgres:
        condition: service_healthy
      content-service-migrations:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_ENV: dev
      SWAGGER_ENABLED: "true"
    volumes:
      - content-storage:/data
      - ./content-service/config.yaml:/app/config.yaml:ro
    ports:
      - "18092:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  stream-service:
    build: ./stream-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stream-service-migrations:
        condition: service_completed_successfully
      content-service:
        condition: service_started
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_ENV: dev
      SWAGGER_ENABLED: "true"
      CONTENT_SERVICE_GRPC: "content-service:8082"
    volumes:
      - ./stream-service/config.yaml:/app/config.yaml:ro
    ports:
      - "18093:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build: ./gateway
    depends_on:
      postgres:
        condition: service_healthy
      user-service-migrations:
        condition: service_completed_successfully
      content-service-migrations:
        condition: service_completed_successfully
      stream-service-migrations:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      content-service:
        condition: service_started
      stream-service:
        condition: service_started
      sender-service:
        condition: service_started
    environment:
      APP_ENV: dev
      GATEWAY_ADDR: ":8080"
      SWAGGER_ENABLED: "true"
      USER_SERVICE_URL: "http://user-service:8080"
      CONTENT_SERVICE_URL: "http://content-service:8080"
      CONTENT_STREAM_URL: "http://content-service:8081"
      STREAM_SERVICE_URL: "http://stream-service:8080"
      SENDER_SERVICE_URL: "ws://sender-service:8081"
      COOKIE_NAME: "access_token"
      COOKIE_MAX_AGE: "86400"
      COOKIE_SECURE_IN_PROD: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "18000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["/usr/local/bin/gateway"]

  sender-service:
    build: ./sender-service
    depends_on:
      redis:
        condition: service_healthy
      stream-service:
        condition: service_started
    environment:
      APP_ENV: dev
      CONTENT_SERVICE_URL: "http://content-service:8081"
    volumes:
      - ./sender-service/config.yaml:/app/config.yaml:ro
    ports:
      - "18095:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  content-storage:
