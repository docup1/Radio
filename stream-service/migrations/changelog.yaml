databaseChangeLog:
  - changeSet:
      id: 001-baseline-streams
      author: radio
      changes:
        - createTable:
            tableName: streams
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: loop
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - createTable:
            tableName: hashtags
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: stream_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: hashtags
            baseColumnNames: stream_id
            constraintName: fk_hashtags_stream_id
            referencedTableName: streams
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_hashtags_stream_id
            tableName: hashtags
            columns:
              - column:
                  name: stream_id
        - createIndex:
            indexName: uq_hashtags_stream_name
            tableName: hashtags
            unique: true
            columns:
              - column:
                  name: stream_id
              - column:
                  name: name

      rollback:
        - dropTable:
            tableName: hashtags
        - dropTable:
            tableName: streams
