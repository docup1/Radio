databaseChangeLog:
  - changeSet:
      id: 001-create-streams-table
      author: radio
      changes:
        - createTable:
            tableName: streams
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: loop
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: streams

  - changeSet:
      id: 002-create-stream-queue-table
      author: radio
      changes:
        - createTable:
            tableName: stream_queue
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: stream_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stream_queue_stream_id
                    references: streams(id)
                    deleteCascade: true
              - column:
                  name: song_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: stream_queue

  - changeSet:
      id: 003-create-stream-queue-indexes
      author: radio
      changes:
        - createIndex:
            indexName: idx_stream_queue_stream_id
            tableName: stream_queue
            columns:
              - column:
                  name: stream_id
        - createIndex:
            indexName: uq_stream_queue_stream_position
            tableName: stream_queue
            unique: true
            columns:
              - column:
                  name: stream_id
              - column:
                  name: position
      rollback:
        - dropIndex:
            indexName: uq_stream_queue_stream_position
            tableName: stream_queue
        - dropIndex:
            indexName: idx_stream_queue_stream_id
            tableName: stream_queue

  - changeSet:
      id: 004-create-hashtags-table
      author: radio
      changes:
        - createTable:
            tableName: hashtags
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: stream_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_hashtags_stream_id
                    references: streams(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: hashtags

  - changeSet:
      id: 005-create-hashtags-indexes
      author: radio
      changes:
        - createIndex:
            indexName: idx_hashtags_stream_id
            tableName: hashtags
            columns:
              - column:
                  name: stream_id
        - createIndex:
            indexName: uq_hashtags_stream_name
            tableName: hashtags
            unique: true
            columns:
              - column:
                  name: stream_id
              - column:
                  name: name
      rollback:
        - dropIndex:
            indexName: uq_hashtags_stream_name
            tableName: hashtags
        - dropIndex:
            indexName: idx_hashtags_stream_id
            tableName: hashtags

  - changeSet:
      id: 006-add-streams-revision
      author: radio
      changes:
        - addColumn:
            tableName: streams
            columns:
              - column:
                  name: revision
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: streams
            columnName: revision

  - changeSet:
      id: 007-create-stream-state-table
      author: radio
      changes:
        - createTable:
            tableName: stream_state
            columns:
              - column:
                  name: stream_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_stream_state_stream_id
                    references: streams(id)
                    deleteCascade: true
              - column:
                  name: current_queue_id
                  type: uuid
                  constraints:
                    nullable: true
                    foreignKeyName: fk_stream_state_current_queue_id
                    references: stream_queue(id)
                    deleteSetNull: true
              - column:
                  name: started_at
                  type: timestamptz
                  constraints:
                    nullable: true
              - column:
                  name: revision
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: stream_state

  - changeSet:
      id: 008-create-outbox-table
      author: radio
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: aggregate_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamptz
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_outbox_processed_at
            tableName: outbox
            columns:
              - column:
                  name: processed_at
        - createIndex:
            indexName: idx_outbox_aggregate_id
            tableName: outbox
            columns:
              - column:
                  name: aggregate_id
      rollback:
        - dropTable:
            tableName: outbox

  - changeSet:
      id: 009-fix-stream-state-fk-set-null
      author: radio
      changes:
        - dropForeignKeyConstraint:
            baseTableName: stream_state
            constraintName: fk_stream_state_current_queue_id
        - addForeignKeyConstraint:
            baseTableName: stream_state
            baseColumnNames: current_queue_id
            constraintName: fk_stream_state_current_queue_id
            referencedTableName: stream_queue
            referencedColumnNames: id
            onDelete: SET NULL
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: stream_state
            constraintName: fk_stream_state_current_queue_id
        - addForeignKeyConstraint:
            baseTableName: stream_state
            baseColumnNames: current_queue_id
            constraintName: fk_stream_state_current_queue_id
            referencedTableName: stream_queue
            referencedColumnNames: id
