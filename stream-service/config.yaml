env: dev
log_level: info

http:
  addr: ":8080"
  read_header_timeout: 5s

grpc:
  addr: ":8082"

db:
  host: postgres
  port: 5432
  user: radio
  name: radio_streams
  sslmode: disable
  ping_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 1h

redis:
  addr: redis:6379
  password: ""
  db: 0
  connect_timeout: 5s

worker:
  outbox_batch_size: 100
  outbox_interval: 100ms
  watchdog_interval: 5s

swagger:
  enabled: false
  path: /swagger
